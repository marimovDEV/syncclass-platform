# Alembic konfiguratsiyasi.
# `sqlalchemy.url` ATAYLAB bo'sh: haqiqiy URL `alembic/env.py` da
# `settings.sqlalchemy_url` dan olinadi (`os.environ` taqiqlangan).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =

# post_write_hooks ATAYLAB bo'sh: `ruff` wheel'i `console_scripts`
# entrypoint ro'yxatdan o'tkazmaydi (u Rust binary), shuning uchun hook
# `alembic revision` ni YIQITADI. Formatlashni qo'lda qilamiz: `ruff format alembic/`.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
