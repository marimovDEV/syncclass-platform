# SyncClass — marshrutlash:
#   /api/           -> backend (katta body, buferlashsiz)
#   /docs           -> backend (FastAPI Swagger UI)
#   /openapi.json   -> backend
#   /healthz /readyz-> backend
#   /ws/            -> backend WebSocket (Upgrade, 3600s timeout)
#   /               -> frontend (Next.js standalone)

upstream syncclass_backend {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream syncclass_frontend {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # --- Xavfsizlik headerlari ---------------------------------------------
    # DIQQAT: `add_header` location ichida qayta yozilsa, server darajasidagilar
    # BEKOR bo'ladi. Shuning uchun hammasi faqat shu yerda turadi.
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                  always;
    # AUDIT.md §F: o'quvchi efirga chiqara olmaydi; ekran ulashish faqat o'qituvchida.
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), display-capture=(self)" always;

    # Nginx'ning o'z healthcheck'i (backend'ga tegmaydi).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- /api/ : katta fayl yuklash yo'li (AUDIT.md §A3.1) ------------------
    location /api/ {
        # Body'ni diskka buferlamaslik uchun uchlik: limit + RAM buferi + streaming.
        client_max_body_size        26m;
        client_body_buffer_size     26m;
        proxy_request_buffering     off;
        proxy_buffering             off;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Request-ID      $http_x_request_id;

        # 25 MB zip sekin tarmoqda uzoq ketadi + AI emas, sinxron R2 upload bor.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_pass http://syncclass_backend;
    }

    # --- FastAPI hujjatlari -------------------------------------------------
    location /docs {
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_scheme;
        proxy_pass http://syncclass_backend;
    }

    location = /openapi.json {
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $forwarded_scheme;
        proxy_pass http://syncclass_backend;
    }

    # --- Health probe'lar (scripts/healthcheck.sh shu yo'llarni so'raydi) ---
    location = /healthz {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_pass http://syncclass_backend;
    }

    location = /readyz {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_pass http://syncclass_backend;
    }

    # --- /ws/ : WebSocket (AUDIT.md §B4 — dars 90 daqiqa, default 60s o'ladi) ---
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_scheme;

        # Jonli kod / laser pointer — buferlash kechikish beradi, o'chiramiz.
        proxy_buffering  off;
        proxy_cache      off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        proxy_pass http://syncclass_backend;
    }

    # --- / : Next.js --------------------------------------------------------
    location / {
        proxy_http_version 1.1;
        # Next.js dev HMR / RSC stream uchun upgrade ham o'tkazamiz.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_pass http://syncclass_frontend;
    }

    # Next.js statik assetlari — uzoq muddatli kesh (hash'li fayl nomlari).
    location /_next/static/ {
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_pass http://syncclass_frontend;

        # Next.js fayl nomlariga hash qo'shadi -> abadiy keshlash xavfsiz.
        # DIQQAT: shu location'da `add_header` ishlatilgani uchun server
        # darajasidagi headerlarni ham QAYTA yozish shart (nginx qoidasi).
        add_header Cache-Control            "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options   "nosniff"                             always;
        add_header X-Frame-Options          "SAMEORIGIN"                          always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    }

    # Xato sahifalari — JSON API bilan aralashmasligi uchun sodda matn.
    error_page 502 503 504 /__upstream_down;
    location = /__upstream_down {
        internal;
        default_type application/json;
        return 503 '{"detail":{"code":"UPSTREAM_DOWN","message":"Servis vaqtincha ishlamayapti. Birozdan so\'ng qayta urinib ko\'ring.","fields":{}}}';
    }
}
