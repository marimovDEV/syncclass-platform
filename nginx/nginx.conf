# SyncClass — Nginx asosiy konfiguratsiyasi (reverse proxy, lokal dev).
# Kritik tuzatishlar: AUDIT.md §A3.1 (body diskka buferlanmasin) va §B4 (WS 60s'da uzilmasin).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Loglar -------------------------------------------------------------
    # AUDIT.md §B3: WS `?ticket=` query-string'da keladi. $request butun URL ni
    # (query bilan) yozadi — ticket logga tushmasin, shuning uchun faqat $uri.
    log_format  syncclass_json  escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"status":$status,'
          '"body_bytes":$body_bytes_sent,'
          '"request_len":$request_length,'
          '"request_time":$request_time,'
          '"upstream":"$upstream_addr",'
          '"upstream_time":"$upstream_response_time",'
          '"request_id":"$http_x_request_id",'
          '"ua":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log  syncclass_json;

    # --- Asosiy sozlamalar --------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    charset         utf-8;

    keepalive_timeout   75s;
    keepalive_requests  1000;
    reset_timedout_connection on;

    types_hash_max_size     2048;
    server_names_hash_bucket_size 64;

    # --- Body limitlari (AUDIT.md §A3.1) -----------------------------------
    # MAX_UPLOAD_MB=25 + multipart overhead -> 26m.
    # client_body_buffer_size default 8–16 KB: shundan katta body DISKKA yoziladi.
    # Buni 26m qilib, body'ni butunlay RAM da ushlaymiz.
    client_max_body_size      26m;
    client_body_buffer_size   26m;
    client_body_timeout       120s;
    client_header_timeout     30s;
    large_client_header_buffers 4 16k;

    # Temp papkalar — compose'da `tmpfs` (RAM disk) qilib mount qilingan
    # /var/cache/nginx ichida. Ya'ni bufer bo'lib qolsa ham diskka tegmaydi.
    client_body_temp_path  /var/cache/nginx/client_temp  1 2;
    proxy_temp_path        /var/cache/nginx/proxy_temp   1 2;
    fastcgi_temp_path      /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path        /var/cache/nginx/uwsgi_temp   1 2;
    scgi_temp_path         /var/cache/nginx/scgi_temp    1 2;

    # --- WebSocket upgrade uchun mapping (AUDIT.md §B4) ---------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Nginx orqasida turgan uvicorn uchun haqiqiy sxema.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # --- gzip ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/x-javascript
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/conf.d/*.conf;
}
